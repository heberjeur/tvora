name: Generate EPG

on:
  schedule:
    - cron: '0 2,6,10,14,18,22 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'extractor/**'
      - '.github/workflows/epg_generator.yml'
    branches:
      - master

permissions:
  contents: write

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: extractor/requirements.txt

      - name: Cache Argos Models
        uses: actions/cache@v4
        with:
          path: ~/.local/share/argos-translate
          key: argos-translate-models-${{ runner.os }}
          restore-keys: |
            argos-translate-models-

      - name: Install Node dependencies
        working-directory: extractor
        run: npm install

      - name: Install Python dependencies
        run: pip install -r extractor/requirements.txt

      - name: Generate French EPG feed
        working-directory: extractor
        run: node src/generate.js

      - name: Translate and Generate English EPG feed
        working-directory: extractor
        run: python src/translate_epg.py

      - name: Deploy to GitHub Pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: extractor/output
          publish_branch: gh-pages
          force_orphan: true

      - name: Commit and push updated assets to master
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/epg_tnt.xml.gz app/src/main/assets/epg_tnt_en.xml.gz extractor/cache/translation_cache.json
          git diff --staged --quiet || (git commit -m "Automate remote EPG assets synchronization [skip ci]" && git push origin master)
